name: Grade Results

# Checks archived picks against final scores and commits
# apps/web/public/results/results-<stamp>.json for each graded run.
#
# Runs several times a day rather than once: MLB night games can finish after
# 06:00 UTC, and a run that finds nothing final yet writes no file and is
# retried by the next pass. Picks that still can't be resolved stay "pending"
# and are re-attempted until they resolve.

on:
  schedule:
    # 9 AM EDT — grades the previous night's slate.
    - cron: "0 13 * * *"
    # 9 PM EDT — catches afternoon games same-day.
    - cron: "0 1 * * *"
  workflow_dispatch:
    inputs:
      regrade_all:
        description: "Re-grade every archived run, not just ungraded ones"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: picks-archive-push
  cancel-in-progress: false

jobs:
  grade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # No install step: the grader is dependency-free ESM so it can run
      # against the score feeds without touching the workspace.
      - name: Grade archived picks
        run: node scripts/grade-picks.mjs ${{ inputs.regrade_all && '--all' || '' }}

      - name: Commit and push results
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # The directory doesn't exist until the first run grades something,
          # and `git add` on a missing path aborts under `set -e`.
          mkdir -p apps/web/public/results
          git add apps/web/public/results

          if git diff --cached --quiet; then
            echo "No new results to commit."
            exit 0
          fi

          GRADED=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "results: graded ${GRADED} run(s) $(date -u +'%Y-%m-%d %H:%M') UTC"

          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
          done

          echo "::error::Could not push results after 4 attempts"
          exit 1
