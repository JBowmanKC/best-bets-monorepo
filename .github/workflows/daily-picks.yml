name: Daily Picks

on:
  schedule:
    # 8 AM EDT
    - cron: "0 12 * * *"
    # 2 PM EDT
    - cron: "0 18 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fetch-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch picks from deployed endpoint
        id: fetch
        run: |
          set -euo pipefail

          DATE=$(date -u +%F)
          TIME=$(date -u +%H:%M)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "time=$TIME" >> "$GITHUB_OUTPUT"

          URL="https://${{ secrets.VERCEL_URL }}/api/best-bets?date=${DATE}&sports=mlb,nfl,nhl"
          echo "Fetching $URL"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" "$URL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::best-bets endpoint returned HTTP $HTTP_STATUS"
            cat response.json || true
            exit 1
          fi

          PICK_COUNT=$(jq '.picks | length' response.json)
          echo "Generated $PICK_COUNT picks for $DATE"

          mkdir -p apps/web/public
          mv response.json apps/web/public/picks.json

      - name: Commit and push picks.json
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/web/public/picks.json

          if git diff --cached --quiet; then
            echo "No changes to picks.json — nothing to commit."
            exit 0
          fi

          git commit -m "picks: ${{ steps.fetch.outputs.date }} ${{ steps.fetch.outputs.time }} UTC"
          git push
