name: Daily Picks

on:
  schedule:
    # GitHub's scheduler has been landing these 3-5.5 hours late (see the
    # guard step below for why that's safe to retry for rather than a
    # problem) — a single 16:07 UTC slot meant picks routinely weren't ready
    # until early evening. Every 30 minutes from noon to ~6pm EDT gives the
    # scheduler many chances to actually fire close to on time; the guard
    # makes every slot after the first a no-op, so this doesn't multiply
    # OddsAPI usage. Minutes are offset off the hour/half-hour since GitHub's
    # scheduler is most congested exactly there and can delay or drop runs.
    - cron: "7,37 16-22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Both this and Grade Results push to the same branch — serialise them so a
  # run can't be rejected for a stale ref.
  group: picks-archive-push
  cancel-in-progress: false

jobs:
  fetch-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check whether today's picks are already generated
        id: guard
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          # There are now many scheduled slots per day (see the schedule
          # comment above) so that at least one lands close to on time
          # despite GitHub's delay — this is what keeps all the slots after
          # the first from each re-hitting the odds API: once picks.json
          # already reflects today's date, every later *scheduled* slot is a
          # no-op, win or lose (even a 0-best-bets day still sets the date,
          # so an off day doesn't get re-fetched 14 times either).
          #
          # Scoped to `schedule` only — a manual workflow_dispatch always
          # runs fresh, since a human triggering it by hand is deliberately
          # asking for a fresh pull (e.g. retrying after a bug fix deploys
          # mid-day), not racing the automated schedule.
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f apps/web/public/picks.json ] && [ "$(jq -r '.date' apps/web/public/picks.json)" = "$DATE" ]; then
            echo "picks.json already reflects $DATE — skipping this scheduled run (an earlier slot today already succeeded)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch picks from deployed endpoint
        id: fetch
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          DATE=$(date -u +%F)
          TIME=$(date -u +%H:%M)
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "time=$TIME" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

          URL="https://${{ secrets.VERCEL_URL }}/api/best-bets?date=${DATE}&sports=nfl"
          echo "Fetching $URL"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" "$URL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::best-bets endpoint returned HTTP $HTTP_STATUS"
            cat response.json || true
            exit 1
          fi

          PICK_COUNT=$(jq '.allPicks | length' response.json)
          BEST_BET_COUNT=$(jq '.bestBets | length' response.json)
          echo "Generated $PICK_COUNT picks for $DATE, selected $BEST_BET_COUNT best bet(s)"

          # picks.json is what the dashboard reads (always the latest run);
          # picks/picks-<stamp>.json is the permanent archive the history page
          # and the results grader work from.
          mkdir -p apps/web/public/picks
          cp response.json "apps/web/public/picks/picks-${STAMP}.json"
          mv response.json apps/web/public/picks.json

      - name: Track today's picks in the bankroll ledger
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/append-bankroll-bets.mjs apps/web/public/picks.json

      - name: Log daily bet summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          cat > log_summary.py <<'PYEOF'
          import json

          d = json.load(open("apps/web/public/picks.json"))
          s = d.get("summary", {})
          bets = d.get("bestBets", [])

          print(f"Sportsbook: {d.get('sportsbook') or 'none (no real book price found)'}")
          print(f"Best Bets: {len(bets)}")
          for b in bets:
              # A best bet can be a moneyline pick (has pickLabel) or a prop
              # pick (playerName/propType/line/recommendedSide, no pickLabel)
              # — build a label from whichever shape this one is.
              label = b.get("pickLabel")
              if not label:
                  side = "Over" if b.get("recommendedSide") == "over" else "Under"
                  line = f"Alt {b.get('line', '?')}" if b.get("isAlternateLine") else b.get("line", "?")
                  label = f"{b.get('playerName', '?')} {side} {line} {b.get('propType', '')}".strip()
              print(f"  - {label} ({b.get('odds', '?')}) stake: ${b.get('stakeAmount', 0):.2f}")

          print(f"Total staked: ${s.get('totalStaked', 0):.2f}")
          print(f"Potential payout: ${s.get('totalPotentialPayout', 0):.2f}")
          print(f"Bankroll at risk: {s.get('bankrollAtRisk', 0)*100:.1f}%")
          PYEOF
          python3 log_summary.py
          rm -f log_summary.py

      - name: Commit and push picks
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/web/public/picks.json "apps/web/public/picks/picks-${{ steps.fetch.outputs.stamp }}.json" apps/web/public/bankroll.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "picks: ${{ steps.fetch.outputs.date }} ${{ steps.fetch.outputs.time }} UTC"

          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
          done

          echo "::error::Could not push picks after 4 attempts"
          exit 1
