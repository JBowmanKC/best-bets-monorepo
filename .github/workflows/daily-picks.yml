name: Daily Picks

on:
  schedule:
    # Fallback only. GitHub throttles this repo's scheduled runs to 1-3 a day,
    # always 3.5-5.5 hours late, regardless of how many slots are listed — the
    # primary trigger is Vercel Cron calling api/trigger-picks (see vercel.json),
    # which dispatches this workflow with respect_guard. Every path shares the
    # guard step below, so whichever fires first wins and the rest are no-ops.
    - cron: "7,37 16-22 * * *"
  workflow_dispatch:
    inputs:
      respect_guard:
        description: "Apply the same already-generated-today dedupe a scheduled run gets (used by the Vercel cron trigger)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Both this and Grade Results push to the same branch — serialise them so a
  # run can't be rejected for a stale ref.
  group: picks-archive-push
  cancel-in-progress: false

jobs:
  fetch-picks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check whether today's picks are already generated
        id: guard
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          # There are now many scheduled slots per day (see the schedule
          # comment above) so that at least one lands close to on time
          # despite GitHub's delay — this is what keeps all the slots after
          # the first from each re-hitting the odds API: once picks.json
          # already reflects today's date, every later *scheduled* slot is a
          # no-op, win or lose (even a 0-best-bets day still sets the date,
          # so an off day doesn't get re-fetched 14 times either).
          #
          # Scoped to `schedule` only — a manual workflow_dispatch always
          # runs fresh, since a human triggering it by hand is deliberately
          # asking for a fresh pull (e.g. retrying after a bug fix deploys
          # mid-day), not racing the automated schedule.
          #
          # Two guards against GitHub's delay pushing slots past midnight UTC:
          # a delayed late-evening slot lands at e.g. 01:14 UTC, which is a new
          # UTC date with no odds posted yet — it used to stamp picks.json with
          # that date and 0 picks, and the check below then treated the day as
          # already done, so every real afternoon slot skipped (Monday night
          # 10/5 got nothing). So: (1) a scheduled run before 16:00 UTC is
          # always a spillover from the previous night's slots and does
          # nothing, and (2) "already generated" only counts a run that
          # actually happened in the daytime window.
          # A manual dispatch always runs fresh; the Vercel cron trigger passes
          # respect_guard so it gets the scheduled-run dedupe instead.
          TREAT_AS_SCHEDULED=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.respect_guard }}" = "true" ]; then TREAT_AS_SCHEDULED=true; fi
          HOUR=$(date -u +%H)
          GENERATED_HOUR=$(jq -r '.generatedAt // "T00" | .[11:13]' apps/web/public/picks.json 2>/dev/null || echo 00)
          if [ "$TREAT_AS_SCHEDULED" = "true" ] && [ $((10#$HOUR)) -lt 16 ]; then
            echo "Scheduled run at ${HOUR}:xx UTC is a delayed spillover from last night's slots — skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "$TREAT_AS_SCHEDULED" = "true" ] && [ -f apps/web/public/picks.json ] && [ "$(jq -r '.date' apps/web/public/picks.json)" = "$DATE" ] && [ $((10#$GENERATED_HOUR)) -ge 16 ]; then
            echo "picks.json already reflects $DATE from a daytime run — skipping this scheduled run (an earlier slot today already succeeded)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fetch picks from deployed endpoint
        id: fetch
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          DATE=$(date -u +%F)
          TIME=$(date -u +%H:%M)
          STAMP=$(date -u +%Y%m%dT%H%M%SZ)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"
          echo "time=$TIME" >> "$GITHUB_OUTPUT"
          echo "stamp=$STAMP" >> "$GITHUB_OUTPUT"

          URL="https://${{ secrets.VERCEL_URL }}/api/best-bets?date=${DATE}&sports=nfl"
          echo "Fetching $URL"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" "$URL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::best-bets endpoint returned HTTP $HTTP_STATUS"
            cat response.json || true
            exit 1
          fi

          PICK_COUNT=$(jq '.allPicks | length' response.json)
          BEST_BET_COUNT=$(jq '.bestBets | length' response.json)
          echo "Generated $PICK_COUNT picks for $DATE, selected $BEST_BET_COUNT best bet(s)"

          # picks.json is what the dashboard reads (always the latest run);
          # picks/picks-<stamp>.json is the permanent archive the history page
          # and the results grader work from.
          mkdir -p apps/web/public/picks
          cp response.json "apps/web/public/picks/picks-${STAMP}.json"
          mv response.json apps/web/public/picks.json

      - name: Track today's picks in the bankroll ledger
        if: steps.guard.outputs.skip != 'true'
        run: node scripts/append-bankroll-bets.mjs apps/web/public/picks.json

      - name: Log daily bet summary
        if: steps.guard.outputs.skip != 'true'
        run: |
          cat > log_summary.py <<'PYEOF'
          import json

          d = json.load(open("apps/web/public/picks.json"))
          s = d.get("summary", {})
          bets = d.get("bestBets", [])

          print(f"Sportsbook: {d.get('sportsbook') or 'none (no real book price found)'}")
          print(f"Best Bets: {len(bets)}")
          for b in bets:
              # A best bet can be a moneyline pick (has pickLabel) or a prop
              # pick (playerName/propType/line/recommendedSide, no pickLabel)
              # — build a label from whichever shape this one is.
              label = b.get("pickLabel")
              if not label:
                  side = "Over" if b.get("recommendedSide") == "over" else "Under"
                  line = f"Alt {b.get('line', '?')}" if b.get("isAlternateLine") else b.get("line", "?")
                  label = f"{b.get('playerName', '?')} {side} {line} {b.get('propType', '')}".strip()
              print(f"  - {label} ({b.get('odds', '?')}) stake: ${b.get('stakeAmount', 0):.2f}")

          print(f"Total staked: ${s.get('totalStaked', 0):.2f}")
          print(f"Potential payout: ${s.get('totalPotentialPayout', 0):.2f}")
          print(f"Bankroll at risk: {s.get('bankrollAtRisk', 0)*100:.1f}%")
          PYEOF
          python3 log_summary.py
          rm -f log_summary.py

      - name: Commit and push picks
        if: steps.guard.outputs.skip != 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/web/public/picks.json "apps/web/public/picks/picks-${{ steps.fetch.outputs.stamp }}.json" apps/web/public/bankroll.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "picks: ${{ steps.fetch.outputs.date }} ${{ steps.fetch.outputs.time }} UTC"

          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
          done

          echo "::error::Could not push picks after 4 attempts"
          exit 1
