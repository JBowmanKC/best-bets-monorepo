name: Resolve Results

# Resolves every pending bankroll bet against real game scores and commits
# apps/web/public/bankroll.json with the updated ledger.
#
# api/resolve-results.ts can't write to the repo itself (Vercel functions run
# on a read-only, ephemeral filesystem) — it resolves everything in memory and
# returns the full updated bankroll object in its response. This workflow is
# what actually persists that response to disk and commits it.

on:
  schedule:
    # 10 AM EDT — after overnight games have finished.
    - cron: "0 14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # All three picks/results workflows push to the same branch — serialise
  # them so a run can't be rejected for a stale ref.
  group: picks-archive-push
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve pending bets against final scores
        id: resolve
        run: |
          set -euo pipefail

          DATE=$(date -u +%F)
          echo "date=$DATE" >> "$GITHUB_OUTPUT"

          URL="https://${{ secrets.VERCEL_URL }}/api/resolve-results"
          echo "Calling $URL"

          HTTP_STATUS=$(curl -sS -o response.json -w "%{http_code}" "$URL")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "::error::resolve-results endpoint returned HTTP $HTTP_STATUS"
            cat response.json || true
            exit 1
          fi

          RESOLVED=$(jq '.resolved' response.json)
          PENDING=$(jq '.pending' response.json)
          BANKROLL=$(jq '.currentBankroll' response.json)
          echo "resolved=$RESOLVED" >> "$GITHUB_OUTPUT"
          echo "Resolved $RESOLVED bet(s); $PENDING still pending; bankroll is now \$$BANKROLL"

          jq '.bankroll' response.json > apps/web/public/bankroll.json.tmp
          mv apps/web/public/bankroll.json.tmp apps/web/public/bankroll.json

      - name: Commit and push bankroll
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add apps/web/public/bankroll.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "results: ${{ steps.resolve.outputs.date }} — ${{ steps.resolve.outputs.resolved }} resolved"

          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" \
              && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "Push attempt $attempt failed; retrying in $((2 ** attempt))s"
            sleep $((2 ** attempt))
          done

          echo "::error::Could not push bankroll after 4 attempts"
          exit 1
